<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="/assets/meta/favicon.ico" />
	<link rel="manifest" href="/manifest.json" />
	<script>
		(function () {
			try {
				var mode = localStorage.getItem("mode-watcher-mode");
				var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.style.colorScheme = dark ? "dark" : "light";
			} catch (e) {}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div id="boot" aria-hidden="true">
		<div class="boot-stack">

				</g>
			</svg>
			<div class="boot-track"><span></span></div>
		</div>
		<style>
			:root {
				--boot-bg: #f5f5f5;
				--boot-fg: #0a0a0a;
				--boot-track: #e5e5e5;
				--boot-primary: #047857;
			}

			:root.dark {
				--boot-bg: #0a0a0a;
				--boot-fg: #fafafa;
				--boot-track: rgb(255 255 255 / 0.1);
				--boot-primary: #34d399;
			}

			html,
			body {
				margin: 0;
				background: var(--boot-bg);
			}

			#boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: var(--boot-bg);
				color: var(--boot-fg);
				transition: opacity 200ms cubic-bezier(0.32, 0.72, 0, 1);
			}

			#boot[data-done] {
				opacity: 0;
				pointer-events: none;
			}

			.boot-stack {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 28px;
				opacity: 0;
				animation: boot-in 300ms cubic-bezier(0.32, 0.72, 0, 1) 150ms forwards;
			}

			.boot-mark {
				width: 44px;
				height: 44px;
			}

			.boot-mark path {
				fill-opacity: 0;
				stroke-dasharray: 1;
				stroke-dashoffset: 1;
				animation: boot-draw 1100ms cubic-bezier(0.32, 0.72, 0, 1) 200ms forwards;
			}

			.boot-track {
				position: relative;
				width: 96px;
				height: 2px;
				overflow: hidden;
				border-radius: 999px;
				background: var(--boot-track);
			}

			.boot-track span {
				position: absolute;
				inset: 0;
				width: 40%;
				border-radius: inherit;
				background: var(--boot-primary);
				animation: boot-slide 1200ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
			}

			@keyframes boot-in {
				from { opacity: 0; transform: translateY(4px); }
				to { opacity: 1; transform: none; }
			}

			@keyframes boot-draw {
				70% { fill-opacity: 0; }
				to { stroke-dashoffset: 0; fill-opacity: 1; }
			}

			@keyframes boot-slide {
				from { transform: translateX(-100%); }
				to { transform: translateX(250%); }
			}

			@media (prefers-reduced-motion: reduce) {
				.boot-stack { animation-duration: 1ms; }
				.boot-mark path { animation: none; fill-opacity: 1; stroke-dashoffset: 0; }
				.boot-track span { animation: none; width: 100%; opacity: 0.4; }
			}
		</style>
	</div>

	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
