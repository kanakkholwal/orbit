<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="/assets/meta/favicon.ico" sizes="48x48" />
	<link rel="icon" href="/assets/meta/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/assets/meta/apple-touch-icon.png" />
	<meta name="theme-color" content="#047857" />
	<link rel="manifest" href="/manifest.json" />
	<script>
		(function () {
			try {
				var mode = localStorage.getItem("mode-watcher-mode");
				var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.documentElement.style.colorScheme = dark ? "dark" : "light";
			} catch (e) {}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div id="boot" aria-hidden="true">
		<div class="boot-stack">
			<svg class="boot-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
				<g fill="currentColor">
					<path d="M 27.346 3.268 A 21 21 0 0 1 43.627 31.468 L 32.316 31.2 A 11 11 0 0 0 29.37 14.4 Z" />
					<path d="M 40.281 37.263 A 21 21 0 0 1 7.719 37.263 L 13.606 27.602 A 11 11 0 0 0 29.629 33.451 Z" />
					<path d="M 4.373 31.468 A 21 21 0 0 1 20.654 3.268 L 26.077 13.198 A 11 11 0 0 0 13.001 24.15 Z" />
				</g>
			</svg>
			<div class="boot-track"><span></span></div>
		</div>
		<style>
			:root {
				--boot-bg: #f5f5f5;
				--boot-fg: #0a0a0a;
				--boot-track: #e5e5e5;
				--boot-primary: #047857;
			}

			:root.dark {
				--boot-bg: #0a0a0a;
				--boot-fg: #fafafa;
				--boot-track: rgb(255 255 255 / 0.1);
				--boot-primary: #34d399;
			}

			html,
			body {
				margin: 0;
				background: var(--boot-bg);
			}

			#boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				background: var(--boot-bg);
				color: var(--boot-fg);
				transition: opacity 200ms cubic-bezier(0.32, 0.72, 0, 1);
			}

			#boot[data-done] {
				opacity: 0;
				pointer-events: none;
			}

			.boot-stack {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 28px;
				opacity: 0;
				animation: boot-in 300ms cubic-bezier(0.32, 0.72, 0, 1) 150ms forwards;
			}

			.boot-mark {
				width: 44px;
				height: 44px;
			}

			.boot-mark path {
				opacity: 0;
				transform-origin: 24px 24px;
				animation: boot-turn 800ms cubic-bezier(0.32, 0.72, 0, 1) 180ms forwards;
			}

			.boot-mark path:nth-child(2) { animation-delay: 270ms; }
			.boot-mark path:nth-child(3) { animation-delay: 360ms; }

			.boot-track {
				position: relative;
				width: 96px;
				height: 2px;
				overflow: hidden;
				border-radius: 999px;
				background: var(--boot-track);
			}

			.boot-track span {
				position: absolute;
				inset: 0;
				width: 40%;
				border-radius: inherit;
				background: var(--boot-primary);
				animation: boot-slide 1200ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
			}

			@keyframes boot-in {
				from { opacity: 0; transform: translateY(4px); }
				to { opacity: 1; transform: none; }
			}

			@keyframes boot-turn {
				from { opacity: 0; transform: rotate(-40deg) scale(0.85); }
				to { opacity: 1; transform: none; }
			}

			@keyframes boot-slide {
				from { transform: translateX(-100%); }
				to { transform: translateX(250%); }
			}

			@media (prefers-reduced-motion: reduce) {
				.boot-stack { animation-duration: 1ms; }
				.boot-mark path { animation: none; opacity: 1; }
				.boot-track span { animation: none; width: 100%; opacity: 0.4; }
			}
		</style>
	</div>

	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
