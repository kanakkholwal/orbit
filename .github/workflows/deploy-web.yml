name: Deploy web

# Manual-only. There is intentionally no `push:` or `pull_request:` trigger
# — Cloudflare deploys are gated behind a human pressing "Run workflow"
# in the GitHub UI (or via `gh workflow run deploy-web.yml`).
on:
  push:
    branches: 
      - main
    paths:
      - 'apps/web/**'  # Only trigger if changes in this directory
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (e.g., production, staging)'
        required: false
        default: 'production'

  
concurrency:
  group: deploy-web 
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  deploy:
    name: Build & deploy to CF Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment }}
      url: https://orbit.nexonauts.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node >= 22.
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build
        env:
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
          PUBLIC_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_ADSENSE_PUBLISHER_ID }}

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: "4"
          command: deploy